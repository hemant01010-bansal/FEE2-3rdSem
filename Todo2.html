<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Google Sans", sans-serif;
            font-optical-sizing: auto;
        }

        input,
        button {
            height: 5vh;
            border: none;
            border-radius: 5px;
            padding: 0px 8px 0px 8px;
            color: rgb(14, 104, 104);
            font-size: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-image: linear-gradient(to right, white, aqua, white);
        }

        .heading {
            font-size: 20px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .heading:hover {
            background-color: rgb(196, 209, 204);
        }

        .headingLinks {
            list-style-type: none;
            display: flex;
            gap: 20px;
        }

        .headingLinks li {
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .headingLinks li:hover {
            background-color: white;
        }

        .parent {
            background-image: linear-gradient(to bottom, white, aqua, white);
            padding-top: 50px;
        }

        .inputTodo {
            width: 100%;
            height: 10vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding-bottom: 50px;
        }


        .inputTodo button:active {
            transform: scale(0.8);
        }

        .tasks {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .task {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px 0 10px 0;
            font-size: 26px;
            border-bottom: 1px solid black;
        }

        .task button:active {
            transform: scale(0.8);
        }
    </style>
</head>

<body>
    <header>
        <div class="heading">To Do ✔️</div>
        <div class="headingLinks">
            <li>About</li>
            <li>Help</li>
            <li>Contact</li>
            <li>History</li>
        </div>
        <div class="noOfTaskCompleted">
            <pre>No. Of Task Completed: </pre>
        </div>
        <!-- <div>
            <i class="fa-solid fa-arrow-rotate-right" style="color: rgb(0, 0, 0);"></i>
        </div> -->
    </header>
    
    <div class="parent">
        <div class="inputTodo">
            <input placeholder="Enter Task:" class="inputTask">
            <button>ADD</button>
        </div>

        <div class="tasks">
        </div>
    </div>

    <script>
        const tasks = document.querySelector(".tasks");

        const task = document.createElement("div");  //create a div for task
        task.className = "task";

        const addTaskButton = document.querySelector(".inputTodo button"); //select add button
        const inputTask = document.querySelector(".inputTask");

        inputTask.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && inputTask.value != "") {
                addTask(inputTask.value);
            }
        })

        const noOfTaskCompleted = document.querySelector(".noOfTaskCompleted");
        let noOfTask = 0;
        noOfTask = localStorage.getItem('noOfTask');
        if (noOfTask == null) {
            noOfTask = 0;
        }
        noOfTaskCompleted.innerText += noOfTask;

        localStorage.setItem('noOfTask', noOfTask);



        addTaskButton.addEventListener("click", () => {  //add event listner on 'add' button.
            console.log(inputTask.value);
            // alert("HI")
            if (inputTask.value != "") {
                addTask(inputTask.value);
            }
            else{
                alert('Enter Task')
            }
        })

        let tasksList = [];
        if (localStorage.getItem("tasks")) {
            tasksList = JSON.parse(localStorage.getItem("tasks"));
            // alert(tasksList);
        }

        //show the task on refresh or on reopening
        let showTask = JSON.parse(localStorage.getItem("tasks"));
        console.log(showTask);
        console.log(showTask.length);
        console.log(showTask[0]);
        for (let i = 0; i < showTask.length; i++) {
            const task = document.createElement("div");
            task.className = "task";
            const para = document.createElement("p");  //create para for adding task text
            const deleteTask = document.createElement("button");  //create button for delete task.
            const completeTask = document.createElement("button");
            const editTask = document.createElement("button");
            para.innerText = showTask[i];
            deleteTask.innerText = "Delete";
            completeTask.innerText = "Completed";
            editTask.innerText = "Edit";
            task.appendChild(para);
            task.appendChild(editTask);
            task.appendChild(completeTask);
            task.appendChild(deleteTask);
            tasks.appendChild(task);

            deleteTask.addEventListener('click', () => {
                let arr = JSON.parse(localStorage.getItem("tasks"));
                if (showTask[i]) {
                    let index = arr.indexOf(showTask[i]);
                    arr.splice(index, 1);
                    localStorage.setItem("tasks", JSON.stringify(arr));
                }
                task.remove();
            })

            completeTask.addEventListener('click', () => {
                let arr = JSON.parse(localStorage.getItem("tasks"));
                let index = arr.indexOf(showTask[i]);
                arr.splice(index, 1);
                localStorage.setItem("tasks", JSON.stringify(arr));
                task.remove();
                noOfTask++;
                noOfTaskCompleted.innerText = `No. Of Task Completed: ${noOfTask}`;
                localStorage.setItem('noOfTask', noOfTask);
            })

            editTask.addEventListener('click', () => {
                const editTaskInput = document.createElement("input");
                taskInput = para.innerText;
                editTaskInput.value = taskInput;
                task.appendChild(editTaskInput);
                editTaskInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        para.innerText = editTaskInput.value;
                        editTaskInput.remove();
                    }
                })
            })
        }



        function addTask(taskInput) {
            const task = document.createElement("div");
            task.className = "task";
            const para = document.createElement("p");  //create para for adding task text
            const deleteTask = document.createElement("button");  //create button for delete task.
            const completeTask = document.createElement("button");
            const editTask = document.createElement("button");
            para.innerText = taskInput;
            deleteTask.innerText = "Delete";
            completeTask.innerText = "Completed";
            editTask.innerText = "Edit";
            task.appendChild(para);
            task.appendChild(editTask);
            task.appendChild(completeTask);
            task.appendChild(deleteTask);
            tasks.appendChild(task);

            tasksList.push(taskInput);
            localStorage.setItem("tasks", JSON.stringify(tasksList));

            inputTask.value = "";  //empty the input area after adding task



            deleteTask.addEventListener('click', () => {
                let arr = JSON.parse(localStorage.getItem("tasks"));
                if (arr) {
                    let index = arr.indexOf(taskInput);
                    arr.splice(index, 1);
                    localStorage.setItem("tasks", JSON.stringify(arr));
                    console.log(arr);
                }

                task.remove();
            })

            completeTask.addEventListener('click', () => {
                let arr = JSON.parse(localStorage.getItem("tasks"));
                let index = arr.indexOf(taskInput);
                alert(taskInput);
                arr.splice(index, 1);
                localStorage.setItem("tasks", JSON.stringify(arr));
                task.remove();
                noOfTask++;
                noOfTaskCompleted.innerText = `No. Of Task Completed: ${noOfTask}`;
                localStorage.setItem("noOfTask", noOfTask);
            })

            editTask.addEventListener('click', () => {
                const editTaskInput = document.createElement("input");
                taskInput = para.innerText;
                editTaskInput.value = taskInput;
                task.appendChild(editTaskInput);
                editTaskInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        para.innerText = editTaskInput.value;
                        editTaskInput.remove();
                    }
                })
            })

        }

        let now = new Date();
        console.log(now);
        let min = now.getMinutes();
        console.log(min);
        
        setTimeout(() => {
            console.log("settimeout");
        }, 2000);

        const a = new Promise((resolve,reject)=>{
            setInterval(()=>{
                let a = Math.random();
                resolve('Hi');
            },2000);
        })

        a.then((data)=>{
            console.log(data);
        }).catch((error)=>{
            console.log(error);
        }).finally(()=>{
            console.log('finally run always');
        })

        function getData(){
            return new Promise(()=>{
                setTimeout((resolve,reject)=>{
                    resolve("Hii promise resolve")
                },2000)
            })
        }

        getData().then((data)=>{

        })
    </script>
</body>

</html>
