<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
</head>
<body>

    <p id="joke">Click the button to get a joke.</p>

    <button onclick="getJoke()">New Joke</button>

    <script>
        async function getJoke() {
            try {
                const response = await fetch("https://official-joke-api.appspot.com/random_joke");
                console.log(response); //const response is a http response which store information about that response, main content etc
                //ex:
                /*Response {
                    type: "cors",
                    url: "https://official-joke-api.appspot.com/random_joke",
                    status: 200,
                    ok: true,
                    headers: Headers,
                    body: ReadableStream,
                    bodyUsed: false
                }*/
                
                
                const data = await response.json();
                console.log(data);

                document.getElementById("joke").innerHTML =
                    "<b>" + data.setup + "</b><br><br>" + data.punchline;

            } catch (error) {
                document.getElementById("joke").innerText =
                    "Failed to load joke!";
                console.log(error);
            }
        }

        // Load one joke when the page opens
        getJoke();
    </script>

</body>
</html>
